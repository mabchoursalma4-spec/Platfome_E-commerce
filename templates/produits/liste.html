{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row mb-4">
        <div class="col-md-12 text-center">
            <h2 class="display-4">Notre Catalogue</h2>
            <hr class="mx-auto" style="width: 50px; border-top: 2px solid var(--gold-titrit);">
        </div>
    </div>

    <div class="row">
        {% for produit in produits %}
        <div class="col-md-4 mb-4">
            <div class="card border-0 shadow-sm">
                <img src="{{ produit.image.url }}" class="card-img-top" alt="{{ produit.nom }}">
                <div class="card-body text-center">
                    <h5 class="card-title">{{ produit.nom }}</h5>
                    <p class="text-muted">{{ produit.prix }} DH</p>
                    <a href="{% url 'detail_produit' id=produit.id %}" class="btn btn-outline-dark btn-sm">Détails</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
